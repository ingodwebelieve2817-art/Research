{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="relative min-h-[70vh] flex items-center justify-center pt-20 pb-16 overflow-hidden">
  <!-- Glowing Spotlight -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[350px] bg-indigo-500/10 blur-[120px] rounded-full pointer-events-none"></div>

  <div class="max-w-md w-full mx-auto px-4 text-center relative z-10">
    <div class="glass p-8 sm:p-12 rounded-3xl border border-white/5 shadow-2xl">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-4xl mb-6">
        <i class="bi bi-question-lg"></i>
      </div>
      <h1 class="font-heading text-5xl font-extrabold text-white mb-4">404</h1>
      <h2 class="text-xl font-bold text-gray-300 mb-4">Lost in Local Space?</h2>
      <p class="text-gray-400 text-sm leading-relaxed mb-8">
        The page you are looking for does not exist or has been moved. Let's get you back to finding top local service providers.
      </p>
      <div class="flex flex-col gap-3">
        <a href="{% url 'home' %}" class="block w-full py-3 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-500 hover:shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-all duration-200">
          Go Back Home
        </a>
        <a href="{% url 'services:provider_list' %}" class="block w-full py-3 rounded-xl text-sm font-medium border border-white/10 text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-200">
          Browse Service Providers
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
