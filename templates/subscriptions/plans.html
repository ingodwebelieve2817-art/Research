{% extends "base.html" %}
{% load static %}
{% block title %}Pricing Plans{% endblock %}
{% block meta_description %}Select the perfect LocalPro reach tier to automatically match and notify target local customers in your city.{% endblock %}
{% block content %}

<!-- Mount element for our React application -->
<div id="pricing-root" 
     data-plans-json="{{ plans_json }}"
     data-user-authenticated="{{ user.is_authenticated|yesno:'true,false' }}"
     data-register-url="{% url 'accounts:register' %}"
     data-subscribe-url="/subscriptions/subscribe/__PLAN_ID__/">
</div>

<!-- Load compiled static assets from Vite build -->
<link rel="stylesheet" href="{% static 'pricing_app/dist/assets/index.css' %}">
<script type="module" src="{% static 'pricing_app/dist/assets/index.js' %}"></script>

{% endblock %}
