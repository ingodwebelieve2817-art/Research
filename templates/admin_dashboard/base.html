<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin Overview{% endblock %} | LocalPro Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap');

    :root {
      --bg-primary: #090d16;
      --bg-secondary: #0f172a;
      --bg-card: rgba(22, 28, 45, 0.7);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-card-hover: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #e2e8f0;
      --text-dimmed: #94a3b8;
      --color-primary: #6366f1;
      --color-secondary: #06b6d4;
      --color-accent: #10b981;
      --color-danger: #ef4444;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-primary) !important;
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .text-muted { color: var(--text-muted) !important; }
    .text-dimmed { color: var(--text-dimmed) !important; }

    .text-gradient {
      background: linear-gradient(135deg, #818cf8 0%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Navbar */
    .navbar {
      background-color: rgba(9, 13, 22, 0.85) !important;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-card);
    }
    .navbar-brand {
      font-family: var(--font-heading);
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main) !important;
    }

    /* Admin Sidebar Layout */
    .admin-container {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .sidebar {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-card);
      padding: 2rem 1.5rem;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-dimmed);
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
      margin-bottom: 0.5rem;
    }

    .sidebar-link:hover, .sidebar-link.active {
      color: var(--text-main);
      background: rgba(99, 102, 241, 0.15);
      border-left: 3px solid var(--color-primary);
    }

    .main-content {
      flex: 1;
      padding: 3rem;
      background-color: var(--bg-primary);
    }

    /* Glass Card */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 2rem;
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      border-color: var(--border-card-hover);
    }

    .card-stat-icon {
      font-size: 2.25rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(6, 182, 212, 0.2) 100%);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Table styling */
    .table-dark-custom {
      background: transparent !important;
      color: var(--text-main) !important;
      border-collapse: separate;
      border-spacing: 0 10px;
    }

    .table-dark-custom th {
      border: none !important;
      color: var(--text-dimmed);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      padding: 12px 16px;
    }

    .table-dark-custom tr {
      background: rgba(22, 28, 45, 0.5);
      border-radius: 8px;
    }

    .table-dark-custom td {
      border: none !important;
      padding: 16px;
      vertical-align: middle;
      border-top: 1px solid var(--border-card);
      border-bottom: 1px solid var(--border-card);
    }

    .table-dark-custom tr td:first-child {
      border-left: 1px solid var(--border-card);
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
    }

    .table-dark-custom tr td:last-child {
      border-right: 1px solid var(--border-card);
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .badge-active {
      background-color: rgba(16, 185, 129, 0.15) !important;
      color: var(--color-accent) !important;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-inactive {
      background-color: rgba(239, 68, 68, 0.15) !important;
      color: var(--color-danger) !important;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="{% url 'admin_dashboard:overview' %}">
        <i class="bi bi-shield-lock-fill text-gradient me-2"></i>LocalPro <span class="fs-6 fw-normal text-dimmed">Admin Portal</span>
      </a>
      <div class="collapse navbar-collapse justify-content-end">
        <span class="navbar-text me-3 text-dimmed">Logged in as: <strong class="text-white">{{ request.user.username }}</strong></span>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <!-- Content Container -->
  <div class="admin-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="mb-4">
        <small class="text-dimmed text-uppercase fw-semibold tracking-wider d-block mb-3">Management</small>
        <a href="{% url 'admin_dashboard:overview' %}" class="sidebar-link {% if request.resolver_match.view_name == 'admin_dashboard:overview' %}active{% endif %}">
          <i class="bi bi-grid-1x2-fill"></i>Overview
        </a>
        <a href="{% url 'admin_dashboard:user_list' %}" class="sidebar-link {% if 'user_list' in request.resolver_match.view_name or 'user_detail' in request.resolver_match.view_name or 'user_edit' in request.resolver_match.view_name %}active{% endif %}">
          <i class="bi bi-people-fill"></i>Users & Profiles
        </a>
      </div>
      
      <div>
        <small class="text-dimmed text-uppercase fw-semibold tracking-wider d-block mb-3">System</small>
        <a href="/" class="sidebar-link">
          <i class="bi bi-house-door-fill"></i>App Home Page
        </a>
        <a href="/admin/" class="sidebar-link" target="_blank">
          <i class="bi bi-database-fill-gear"></i>Django Admin
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      {% if messages %}
        <div class="mb-4">
          {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show bg-secondary text-white border-0" role="alert">
              {{ message }}
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
