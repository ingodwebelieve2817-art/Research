<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin Overview{% endblock %} | LocalPro Admin</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#030712',
              card: '#0b0f19',
              accent: '#6366f1',
              accentHover: '#4f46e5',
            }
          }
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-[#030712] text-gray-100 font-sans antialiased selection:bg-indigo-500 selection:text-white;
      }
      
      /* Global Django Form Input styling inside admin dashboard */
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"],
      input[type="url"],
      input[type="number"],
      select,
      textarea {
        @apply w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 focus:bg-gray-900 transition-all duration-200;
      }

      ::-webkit-scrollbar {
        @apply w-2 h-2;
      }
      ::-webkit-scrollbar-track {
        @apply bg-gray-950;
      }
      ::-webkit-scrollbar-thumb {
        @apply bg-gray-800 rounded-full hover:bg-gray-700 transition-colors;
      }
    }

    .glass {
      @apply bg-[#0b0f19]/80 backdrop-blur-xl border border-white/5;
    }

    .text-gradient {
      @apply bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 w-full glass border-b border-white/5">
    <div class="px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a class="flex items-center gap-2 font-heading font-extrabold text-xl tracking-tight text-white group" href="{% url 'admin_dashboard:overview' %}">
          <span class="p-1.5 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 group-hover:scale-105 transition-transform duration-200">
            <i class="bi bi-shield-lock-fill"></i>
          </span>
          <span>LocalPro <span class="text-xs font-normal text-gray-500 font-sans ml-1 bg-gray-900 border border-white/5 px-2 py-0.5 rounded-full">Admin Portal</span></span>
        </a>
        
        <div class="flex items-center gap-4">
          <span class="hidden md:inline text-xs text-gray-400">Logged in as: <strong class="text-white font-medium">{{ request.user.username }}</strong></span>
          <a href="{% url 'accounts:logout' %}" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-900 hover:bg-gray-800 border border-white/5 text-gray-300 hover:text-white transition-all duration-200">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Container -->
  <div class="flex flex-1 flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-gray-950/40 md:border-r border-white/5 p-6 flex flex-col gap-6">
      <div>
        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-3">Management</span>
        <nav class="flex flex-col gap-1.5">
          <a href="{% url 'admin_dashboard:overview' %}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 {% if request.resolver_match.view_name == 'admin_dashboard:overview' %}bg-indigo-500/10 text-indigo-400 border border-indigo-500/20{% else %}text-gray-400 hover:text-white hover:bg-white/5 border border-transparent{% endif %}">
            <i class="bi bi-grid-1x2-fill"></i>Overview
          </a>
          <a href="{% url 'admin_dashboard:user_list' %}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 {% if 'user_list' in request.resolver_match.view_name or 'user_detail' in request.resolver_match.view_name or 'user_edit' in request.resolver_match.view_name %}bg-indigo-500/10 text-indigo-400 border border-indigo-500/20{% else %}text-gray-400 hover:text-white hover:bg-white/5 border border-transparent{% endif %}">
            <i class="bi bi-people-fill"></i>Users & Profiles
          </a>
        </nav>
      </div>
      
      <div>
        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-3">System</span>
        <nav class="flex flex-col gap-1.5">
          <a href="/" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200">
            <i class="bi bi-house-door-fill"></i>App Home Page
          </a>
          <a href="/admin/" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-all duration-200" target="_blank">
            <i class="bi bi-database-fill-gear"></i>Django Admin
          </a>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10">
      {% if messages %}
        <div class="mb-6 flex flex-col gap-2">
          {% for message in messages %}
            <div class="flex items-center justify-between p-4 rounded-xl border {% if message.tags == 'success' %}bg-emerald-500/10 border-emerald-500/20 text-emerald-400{% elif message.tags == 'error' or message.tags == 'danger' %}bg-rose-500/10 border-rose-500/20 text-rose-400{% else %}bg-indigo-500/10 border-indigo-500/20 text-indigo-400{% endif %}" role="alert">
              <span class="text-sm font-medium">{{ message }}</span>
              <button type="button" class="text-gray-400 hover:text-white transition-colors" onclick="this.parentElement.remove()">
                <i class="bi bi-x-lg text-sm"></i>
              </button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
