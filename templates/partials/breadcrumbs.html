{% if breadcrumbs %}
<nav aria-label="Breadcrumb" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 mb-4 text-xs font-medium text-gray-500 flex items-center gap-2">
  <a href="{% url 'home' %}" class="hover:text-white transition-colors flex items-center gap-1">
    <i class="bi bi-house-door"></i> Home
  </a>
  {% for name, url in breadcrumbs %}
    <span class="text-gray-700">/</span>
    {% if url %}
      <a href="{{ url }}" class="hover:text-white transition-colors">{{ name }}</a>
    {% else %}
      <span class="text-gray-300 font-semibold">{{ name }}</span>
    {% endif %}
  {% endfor %}
</nav>

<!-- BreadcrumbList Schema.org JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ request.scheme }}://{{ request.get_host }}{% url 'home' %}"
    }
    {% for name, url in breadcrumbs %}
    ,{
      "@type": "ListItem",
      "position": {{ forloop.counter|add:1 }},
      "name": "{{ name }}",
      "item": "{{ request.scheme }}://{{ request.get_host }}{{ url|default:request.path }}"
    }
    {% endfor %}
  ]
}
</script>
{% endif %}
